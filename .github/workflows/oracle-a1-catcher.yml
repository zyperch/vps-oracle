name: Oracle A1 Catcher

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: oracle-a1-catcher
  cancel-in-progress: false

jobs:
  catcher:
    runs-on: ubuntu-latest

    env:
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar OCI CLI
        run: |
          pip install --quiet oci-cli
          oci --version

      - name: Configurar credenciais OCI
        shell: bash
        run: |
          mkdir -p ~/.oci

          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

      - name: Testar autenticação
        run: |
          oci iam availability-domain list > /dev/null
          echo "Autenticação OCI funcionando."

      # ============================================================
      # ESTADO PERSISTENTE DA CAÇA
      # ============================================================

      - name: Registrar tentativa
        id: hunt_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          STATE_TITLE="[A1-CATCHER] Estado interno"
          API="/repos/${GITHUB_REPOSITORY}/issues"

          echo "Procurando estado anterior..."

          ISSUE_NUMBER=$(
            gh api "${API}?state=all&per_page=100" \
              --jq ".[] | select(.title == \"${STATE_TITLE}\") | .number" \
              | head -n 1
          )

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ -z "$ISSUE_NUMBER" ]; then

            echo "Nenhum estado anterior encontrado."
            echo "Iniciando nova caça."

            STARTED_AT="$NOW"
            ATTEMPT=1

            BODY=$(
              jq -n \
                --arg started_at "$STARTED_AT" \
                --arg updated_at "$NOW" \
                --arg run_id "$GITHUB_RUN_ID" \
                --argjson attempt "$ATTEMPT" \
                '{
                  started_at: $started_at,
                  attempt: $attempt,
                  last_updated_at: $updated_at,
                  last_run_id: $run_id
                }'
            )

            CREATED=$(
              gh api \
                --method POST \
                "$API" \
                -f title="$STATE_TITLE" \
                -f body="$BODY"
            )

            ISSUE_NUMBER=$(
              printf '%s' "$CREATED" |
                jq -r '.number'
            )

          else

            echo "Estado encontrado no Issue #$ISSUE_NUMBER"

            BODY=$(
              gh api \
                "$API/$ISSUE_NUMBER" \
                --jq '.body'
            )

            STARTED_AT=$(
              printf '%s' "$BODY" |
                jq -r '.started_at // empty'
            )

            PREVIOUS_ATTEMPT=$(
              printf '%s' "$BODY" |
                jq -r '.attempt // 0'
            )

            if [ -z "$STARTED_AT" ] || [ "$STARTED_AT" = "null" ]; then
              STARTED_AT="$NOW"
            fi

            if ! [[ "$PREVIOUS_ATTEMPT" =~ ^[0-9]+$ ]]; then
              PREVIOUS_ATTEMPT=0
            fi

            ATTEMPT=$((PREVIOUS_ATTEMPT + 1))

            BODY=$(
              jq -n \
                --arg started_at "$STARTED_AT" \
                --arg updated_at "$NOW" \
                --arg run_id "$GITHUB_RUN_ID" \
                --argjson attempt "$ATTEMPT" \
                '{
                  started_at: $started_at,
                  attempt: $attempt,
                  last_updated_at: $updated_at,
                  last_run_id: $run_id
                }'
            )

            gh api \
              --method PATCH \
              "$API/$ISSUE_NUMBER" \
              -f body="$BODY" \
              > /dev/null

          fi

          START_EPOCH=$(date -d "$STARTED_AT" +%s)
          NOW_EPOCH=$(date -u +%s)

          ELAPSED=$((NOW_EPOCH - START_EPOCH))

          DAYS=$((ELAPSED / 86400))
          HOURS=$(((ELAPSED % 86400) / 3600))
          MINUTES=$(((ELAPSED % 3600) / 60))

          if [ "$DAYS" -gt 0 ]; then
            ELAPSED_TEXT="${DAYS}d ${HOURS}h ${MINUTES}min"
          elif [ "$HOURS" -gt 0 ]; then
            ELAPSED_TEXT="${HOURS}h ${MINUTES}min"
          else
            ELAPSED_TEXT="${MINUTES}min"
          fi

          echo ""
          echo "======================================"
          echo "Estado da caça"
          echo "======================================"
          echo "Tentativa: #$ATTEMPT"
          echo "Início: $STARTED_AT"
          echo "Tempo caçando: $ELAPSED_TEXT"
          echo "Issue de estado: #$ISSUE_NUMBER"
          echo "======================================"

          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          echo "elapsed=$ELAPSED_TEXT" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      # ============================================================
      # ORACLE A1 CATCHER
      # ============================================================

      - name: Procurar e criar A1
        id: catcher
        shell: bash
        run: |
          set -euo pipefail

          echo "result=unknown" >> "$GITHUB_OUTPUT"

          INSTANCE_NAME="oracle-a1-free"

          SUBNET_ID="ocid1.subnet.oc1.phx.aaaaaaaabc3mznwwnefjuszs7dbjc4bduoxr2ycrhhphtc3ax4h33puuhw6q"

          ADS=(
            "hEWV:PHX-AD-1"
            "hEWV:PHX-AD-2"
            "hEWV:PHX-AD-3"
          )

          SSH_PUBLIC_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDjccrD7P62MVJQm1zDVFRmyhsHbwGiy2vrxYOjx9XFe oracle-a1"

          echo "Verificando se a VPS já existe..."

          INSTANCE_JSON=$(
            oci compute instance list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json
          )

          if [ -z "$INSTANCE_JSON" ]; then
            EXISTING=0
          else
            EXISTING=$(
              printf '%s' "$INSTANCE_JSON" |
                jq '[.data[]? | select(."lifecycle-state" != "TERMINATED")] | length'
            )
          fi

          echo "Instâncias existentes com nome $INSTANCE_NAME: $EXISTING"

          if [ "$EXISTING" -gt 0 ]; then
            echo "result=exists" >> "$GITHUB_OUTPUT"
            echo "A VPS já existe."
            exit 0
          fi

          echo "Buscando Ubuntu 22.04 ARM mais recente..."

          IMAGE_ID=$(
            oci compute image list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --operating-system "Canonical Ubuntu" \
              --operating-system-version "22.04" \
              --shape "VM.Standard.A1.Flex" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --limit 1 \
              --query 'data[0].id' \
              --raw-output
          )

          if [ -z "$IMAGE_ID" ] || \
             [ "$IMAGE_ID" = "null" ] || \
             [ "$IMAGE_ID" = "None" ]; then

            echo "Não foi possível encontrar uma imagem Ubuntu 22.04 ARM."
            exit 1
          fi

          echo "Imagem encontrada: $IMAGE_ID"

          cat > /tmp/capacity.json <<'EOF'
          [
            {
              "instanceShape": "VM.Standard.A1.Flex",
              "instanceShapeConfig": {
                "ocpus": 2,
                "memoryInGBs": 12
              }
            }
          ]
          EOF

          printf '%s\n' "$SSH_PUBLIC_KEY" > /tmp/oracle-a1.pub

          for AD in "${ADS[@]}"; do

            echo ""
            echo "======================================"
            echo "Verificando $AD"
            echo "======================================"

            STATUS=$(
              oci compute compute-capacity-report create \
                --availability-domain "$AD" \
                --compartment-id "$OCI_TENANCY_OCID" \
                --shape-availabilities file:///tmp/capacity.json \
                --query 'data."shape-availabilities"[0]."availability-status"' \
                --raw-output
            )

            echo "Status: $STATUS"

            if [ "$STATUS" != "AVAILABLE" ]; then
              continue
            fi

            echo ""
            echo "CAPACIDADE ENCONTRADA EM $AD"
            echo "Tentando criar a VPS..."

            set +e

            LAUNCH_OUTPUT=$(
              oci compute instance launch \
                --availability-domain "$AD" \
                --compartment-id "$OCI_TENANCY_OCID" \
                --shape "VM.Standard.A1.Flex" \
                --shape-config '{"ocpus":2,"memoryInGBs":12}' \
                --image-id "$IMAGE_ID" \
                --subnet-id "$SUBNET_ID" \
                --assign-public-ip true \
                --boot-volume-size-in-gbs 50 \
                --ssh-authorized-keys-file /tmp/oracle-a1.pub \
                --display-name "$INSTANCE_NAME" \
                --output json 2>&1
            )

            EXIT_CODE=$?

            set -e

            if [ "$EXIT_CODE" -eq 0 ]; then

              INSTANCE_ID=$(
                printf '%s' "$LAUNCH_OUTPUT" |
                  jq -r '.data.id'
              )

              echo ""
              echo "======================================"
              echo "VPS CRIADA COM SUCESSO!"
              echo "======================================"
              echo "OCID: $INSTANCE_ID"
              echo "AD: $AD"

              echo "result=created" >> "$GITHUB_OUTPUT"
              echo "ad=$AD" >> "$GITHUB_OUTPUT"
              echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo ""
            echo "Falha ao criar a VPS:"
            echo "$LAUNCH_OUTPUT"

            echo "result=launch_error" >> "$GITHUB_OUTPUT"
            echo "ad=$AD" >> "$GITHUB_OUTPUT"

            exit 1
          done

          echo ""
          echo "Nenhuma capacidade encontrada agora."

          echo "result=no_capacity" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DISCORD
      # ============================================================

      - name: Notificar Discord
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.catcher.outputs.result }}
          AD: ${{ steps.catcher.outputs.ad }}
          INSTANCE_ID: ${{ steps.catcher.outputs.instance_id }}
          CATCHER_OUTCOME: ${{ steps.catcher.outcome }}

          ATTEMPT: ${{ steps.hunt_state.outputs.attempt }}
          STARTED_AT: ${{ steps.hunt_state.outputs.started_at }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          #
          # Recalcula o tempo no momento da notificação
          #
          if [ -n "${STARTED_AT:-}" ]; then

            START_EPOCH=$(date -d "$STARTED_AT" +%s)
            NOW_EPOCH=$(date -u +%s)

            ELAPSED=$((NOW_EPOCH - START_EPOCH))

            DAYS=$((ELAPSED / 86400))
            HOURS=$(((ELAPSED % 86400) / 3600))
            MINUTES=$(((ELAPSED % 3600) / 60))

            if [ "$DAYS" -gt 0 ]; then
              HUNT_TIME="${DAYS}d ${HOURS}h ${MINUTES}min"
            elif [ "$HOURS" -gt 0 ]; then
              HUNT_TIME="${HOURS}h ${MINUTES}min"
            else
              HUNT_TIME="${MINUTES}min"
            fi

          else
            HUNT_TIME="N/A"
          fi

          if [ "$CATCHER_OUTCOME" = "failure" ]; then

            MESSAGE="🔴 **Oracle A1 Catcher - ERRO**

          🔎 **Tentativa:** #${ATTEMPT:-N/A}
          ⏱️ **Tempo caçando:** ${HUNT_TIME}

          O workflow encontrou um erro durante a execução.

          **Resultado:** \`${RESULT:-unknown}\`
          **AD:** \`${AD:-N/A}\`

          🔗 **Logs:**
          $RUN_URL"

          elif [ "$RESULT" = "created" ]; then

            MESSAGE="🟢 **ORACLE A1 CRIADA!**

          🚀 **CONSEGUIMOS PEGAR A VPS!**

          🎯 **Tentativa:** #${ATTEMPT:-N/A}
          ⏱️ **Tempo total caçando:** ${HUNT_TIME}

          **Shape:** VM.Standard.A1.Flex
          **CPU:** 2 OCPU
          **RAM:** 12 GB
          **Sistema:** Ubuntu 22.04 ARM
          **AD:** \`$AD\`

          **Instance OCID:**
          \`$INSTANCE_ID\`

          🔗 **Execução:**
          $RUN_URL"

          elif [ "$RESULT" = "exists" ]; then

            MESSAGE="🔵 **Oracle A1 Catcher**

          🔎 **Tentativa:** #${ATTEMPT:-N/A}
          ⏱️ **Tempo caçando:** ${HUNT_TIME}

          A VPS \`oracle-a1-free\` já existe.

          Nenhuma nova instância foi criada.

          🔗 **Execução:**
          $RUN_URL"

          elif [ "$RESULT" = "no_capacity" ]; then

            MESSAGE="🟡 **Oracle A1 Catcher**

          🔎 **Tentativa:** #${ATTEMPT:-N/A}
          ⏱️ **Tempo caçando:** ${HUNT_TIME}

          Verificação concluída.

          ❌ PHX-AD-1: sem capacidade
          ❌ PHX-AD-2: sem capacidade
          ❌ PHX-AD-3: sem capacidade

          ⏳ Próxima tentativa automática em aproximadamente 5 minutos.

          🔗 **Execução:**
          $RUN_URL"

          else

            MESSAGE="🔴 **Oracle A1 Catcher**

          🔎 **Tentativa:** #${ATTEMPT:-N/A}
          ⏱️ **Tempo caçando:** ${HUNT_TIME}

          A execução terminou em um estado inesperado.

          **Resultado:** \`${RESULT:-unknown}\`

          🔗 **Logs:**
          $RUN_URL"

          fi

          PAYLOAD=$(
            jq -n \
              --arg content "$MESSAGE" \
              '{content: $content}'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" || true

      # ============================================================
      # PARA DE CAÇAR DEPOIS QUE CONSEGUIR
      # ============================================================

      - name: Desativar catcher após criar a VPS
        if: steps.catcher.outputs.result == 'created'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "VPS criada. Desativando futuras execuções do catcher..."

          gh api \
            --method PUT \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/oracle-a1-catcher.yml/disable"

          echo "Workflow desativado."
